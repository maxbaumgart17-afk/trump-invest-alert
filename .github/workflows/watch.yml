name: Trump Invest Alert

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (GitHub kann sich um ein paar Minuten verspäten)
  workflow_dispatch:        # manuell starten über den "Run workflow"-Knopf
    inputs:
      backfill:
        description: "Zum Testen: die letzten N Posts erneut bewerten (0 = normal)"
        default: "0"
      test:
        description: "Nur eine Test-Nachricht schicken"
        type: boolean
        default: false

permissions:
  contents: write           # um seen.json (bereits gesehene Posts) zu speichern

concurrency:
  group: trump-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Claude Code installieren (nutzt dein Claude-Abo)
        run: npm install -g @anthropic-ai/claude-code
      - name: Neue Posts prüfen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_RELEVANCE: ${{ vars.MIN_RELEVANCE || '6' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python trump_watch.py --test
          else python trump_watch.py --backfill "${{ inputs.backfill || '0' }}"; fi
      - name: Gesehene Posts speichern
        run: |
          git config user.name "trump-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json telegram_chat.txt 2>/dev/null || git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json aktualisiert" && git push)
