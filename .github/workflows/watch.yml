name: Trump Invest Alert

on:
  schedule:
    # Startet einen Dauer-Lauf (prüft jede Minute, ca. 5¾ Stunden lang).
    # Der häufige Zeitplan sorgt dafür, dass immer schon der nächste Lauf bereitsteht.
    - cron: "*/20 * * * *"
  workflow_dispatch:        # manuell starten über den "Run workflow"-Knopf
    inputs:
      backfill:
        description: "Zum Testen: die letzten N Posts erneut bewerten (0 = normal)"
        default: "0"
      loop:
        description: "Dauerbetrieb jetzt starten (prüft jede Minute, ca. 5¾ Std.)"
        type: boolean
        default: false
      dryrun:
        description: "Probelauf: bewerten und anzeigen, aber nichts senden"
        type: boolean
        default: false
      test:
        description: "Nur eine Test-Nachricht schicken"
        type: boolean
        default: false

permissions:
  contents: write           # um seen.json (bereits gesehene Posts) zu speichern

concurrency:
  # Dauer-Läufe nacheinander; manuelle Tests laufen unabhängig davon sofort
  group: trump-watch-${{ (github.event_name == 'schedule' || inputs.loop) && 'loop' || 'manual' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Claude Code installieren (nutzt dein Claude-Abo)
        run: npm install -g @anthropic-ai/claude-code
      - name: Neue Posts prüfen
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_RELEVANCE: ${{ vars.MIN_RELEVANCE || '6' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
          GIT_SYNC: "1"
        run: |
          git config user.name "trump-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.loop }}" = "true" ]; then
            python -u trump_watch.py --loop 60 --duration 20700
          elif [ "${{ inputs.test }}" = "true" ]; then
            python trump_watch.py --test
          elif [ "${{ inputs.dryrun }}" = "true" ]; then
            python trump_watch.py --dry-run --backfill "${{ inputs.backfill || '0' }}"
          else
            python trump_watch.py --backfill "${{ inputs.backfill || '0' }}"
          fi
      - name: Gesehene Posts speichern
        if: always()
        run: |
          git add seen.json telegram_chat.txt 2>/dev/null || git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json aktualisiert" && git pull -q --rebase -X theirs && git push)
