name: Trump Invest Alert

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 5 Minuten (GitHub kann sich um ein paar Minuten verspäten)
  workflow_dispatch:        # manuell starten über den "Run workflow"-Knopf

permissions:
  contents: write           # um seen.json (bereits gesehene Posts) zu speichern

concurrency:
  group: trump-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Neue Posts prüfen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_RELEVANCE: ${{ vars.MIN_RELEVANCE || '6' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
        run: python trump_watch.py
      - name: Gesehene Posts speichern
        run: |
          git config user.name "trump-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "seen.json aktualisiert" && git push)
